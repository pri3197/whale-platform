services:
  - type: web
    name: whale-platform-backend
    env: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: whale-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: whale-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: whale-db
          property: database
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: whale-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: whale-db
          property: password

  - type: web
    name: whale-platform-frontend
    env: docker
    plan: free
    region: oregon
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile

databases:
  - name: whale-db
    plan: free
    region: oregon
